# Universo de activos. Editar esta lista no requiere tocar código.
# Cada activo: simbolo (ticker del proveedor), nombre, sector.
# El sector se usa en fase 2+ para el límite "máximo 2 posiciones por sector".
# Los tickers de Yahoo se verifican en la primera descarga real: un ticker que no
# devuelva datos aparece como incidencia en el informe de validación.

