  cripto:
    nombre: Cripto
    proveedor: kraken
    moneda: EUR
    referencia: BTC/EUR
    hora_corte: "01:30"      # la vela diaria de Kraken cierra a las 00:00 UTC
    desfase_dias: 1          # a las 01:30 del día D se cierra la vela del día D-1
    # Kraken solo da ~720 velas diarias por su API pública. La historia anterior
    # se completa con Yahoo (simbolo_historia). Ver config/datos.yaml.
    activos:
      - {simbolo: BTC/EUR, simbolo_historia: BTC-EUR, nombre: Bitcoin, sector: cripto}
      - {simbolo: ETH/EUR, simbolo_historia: ETH-EUR, nombre: Ethereum, sector: cripto}
      - {simbolo: SOL/EUR, simbolo_historia: SOL-EUR, nombre: Solana, sector: cripto}
      - {simbolo: XRP/EUR, simbolo_historia: XRP-EUR, nombre: XRP, sector: cripto}
      - {simbolo: ADA/EUR, simbolo_historia: ADA-EUR, nombre: Cardano, sector: cripto}
      - {simbolo: LINK/EUR, simbolo_historia: LINK-EUR, nombre: Chainlink, sector: cripto}
      - {simbolo: AVAX/EUR, simbolo_historia: AVAX-EUR, nombre: Avalanche, sector: cripto}
      - {simbolo: DOGE/EUR, simbolo_historia: DOGE-EUR, nombre: Dogecoin, sector: cripto}

