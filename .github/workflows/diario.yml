# Email diario de señales (fase 3). Nunca envía órdenes a ningún bróker.
#
# GitHub usa la hora UTC: 05:00 UTC son las 07:00 en Ámsterdam en verano y 06:00 UTC lo son
# en invierno. Se lanza a las dos horas y el programa solo envía si ya son las 07:00 en
# Ámsterdam y hoy no se ha enviado (datos/ultimo_envio.txt).
name: Email diario

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Enviar ahora aunque no sea la hora o ya se haya enviado hoy"
        type: boolean
        default: false

permissions:
  contents: write      # para guardar el historial de señales en el repositorio

concurrency:
  group: email-diario
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar caché de datos
        uses: actions/cache@v4
        with:
          path: datos/cache
          key: datos-${{ github.run_id }}
          restore-keys: datos-

      - name: Generar y enviar el email
        env:
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_CLAVE: ${{ secrets.SMTP_CLAVE }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main ${{ inputs.forzar && '--forzar' || '' }}

      - name: Guardar historial
        run: |
          git config user.name "alertas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/historial_senales.csv datos/ultimo_envio.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Historial de señales $(date -u +%F)"
            git push
          fi
